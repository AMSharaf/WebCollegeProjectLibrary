<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Edit/Delete Books - Book Store</title>
        <meta name="description" content="our book store">
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        <header>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="admin_dashboard.html">Dashboard</a></li>
                    <li><a href="edit_book.html">Edit/Delete Books</a></li>
                    <li><a href="index.html">Logout</a></li>
                </ul>
            </nav>
        </header>

        <h1>make your changes</h1>

        <hr>

        <h2>choose your book</h2>
        <div class="Book Choice">
                <label for="Book Choice">Choose a book</label>
                <select id="bookSelect">
                </select>
            </div>
        
        <hr>

        <h2>Delete The Book:</h2>
        <button id="deleteBtn">Delete</button>

        <hr>

        <h2>Edit The Book:</h2>

        <form id="editBookForm">
            <div>
                <input type="number"
                placeholder="Id"
                required
                id="id"
                readonly
                >
            </div>

            <br>
            
            <div class="book_name">
                <input type="text"
                placeholder="Name"
                required
                id="name">
            </div>

            <br>

            <div class="author">
                <input type="text" 
                placeholder="Author"
                required
                id="author">
            </div>

            <br>

            <div class="Category">
                <label for="Category">Category</label>
                <select id="Category">
                    <option value="Horror">Horror</option>
                    <option value="Romantic">Romantic</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                    <option value="History">History</option>
                </select>
            </div>

            <br>

            <div class="Description">
                <textarea
                id="description"
                required
                placeholder="Description"
                rows="8"
                ></textarea>
            </div>

            <br>

            <input type="submit" value="Confirm">
        </form>

        <footer>
            <p>&copy; 2026 Book Store. All rights reserved.</p>
        </footer>

        <script src="admin.js"></script>
    </body>
</html>
