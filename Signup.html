<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyLibrary</title>
    <link rel="stylesheet" href="CSS/main.css" />
    <link rel="stylesheet" href="CSS/loginSinup.css" />
  </head>

  <body>
    <div class="container-flex-column signup-box">
      <h1>SignUp</h1>
      <p id="error-message"></p>
      <form action="index.html" method="get" id="form">
        <div class="form-element">
          <label for="UserName">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-person-circle"
              viewBox="0 0 16 16"
            >
              <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
              <path
                fill-rule="evenodd"
                d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
              />
            </svg>
          </label>
          <input
            type="text"
            name="UserName"
            id="UserName"
            placeholder="Username"
          />
        </div>
        <div class="form-element">
          <label for="email">@</label>
          <input type="email" name="email" id="email" placeholder="Email" />
        </div>
        <div class="form-element">
          <label for="Password">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-lock-fill"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"
              />
            </svg>
          </label>
          <input
            type="password"
            name="Password"
            id="Password"
            placeholder="Password"
          />
        </div>
        <div class="form-element">
          <label for="ConfirmPassword">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-lock-fill"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M8 0a4 4 0 0 1 4 4v2.05a2.5 2.5 0 0 1 2 2.45v5a2.5 2.5 0 0 1-2.5 2.5h-7A2.5 2.5 0 0 1 2 13.5v-5a2.5 2.5 0 0 1 2-2.45V4a4 4 0 0 1 4-4m0 1a3 3 0 0 0-3 3v2h6V4a3 3 0 0 0-3-3"
              />
            </svg>
          </label>
          <input
            type="password"
            name="ConfirmPassword"
            id="ConfirmPassword"
            placeholder="Confirm Password"
          />
        </div>
        <div>
          <label for="is_admin" class="type-label">Type: </label>
          <input type="radio" name="type" id="Admin" required />
          <label for="Admin">Admin</label>
          <input type="radio" name="type" id="User" />
          <label for="User">User</label>
        </div>

        <input type="submit" value="Signup" class="btn" />
      </form>
      <p>Already have an Account? <a href="./Login.html">Login</a></p>
    </div>
    <script src="JavaScript/validation.js"></script>
  </body>
</html>
