<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Add New Book - Book Store</title>
    <meta name="description" content="our book store" />
    <link rel="stylesheet" href="CSS/main.css" />
  </head>

  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="admin_dashboard.html">Dashboard</a></li>
          <li><a href="edit_book.html">Edit/Delete Books</a></li>
          <li><a href="index.html">Logout</a></li>
        </ul>
      </nav>
    </header>

    <h1>Add a New Book</h1>

    <form id="addBookForm">
      <div class="id">
        <input type="number" placeholder="Id" required id="id" />
      </div>

      <br />

      <div class="book_name">
        <input type="text" placeholder="Name" required id="name" />
      </div>

      <br />

      <div class="author">
        <input type="text" placeholder="Author" required id="author" />
      </div>

      <br />

      <div class="Category">
        <label for="Category">Category</label>
        <select id="Category">
          <option value="Horror">Horror</option>
          <option value="Romantic">Romantic</option>
          <option value="Fantasy">Fantasy</option>
          <option value="Fiction">Fiction</option>
          <option value="Science">Science</option>
          <option value="History">History</option>
        </select>
      </div>

      <br />

      <div class="Description">
        <textarea
          required
          placeholder="Description"
          rows="8"
          id="description"
        ></textarea>
      </div>

      <br />

      <input type="submit" value="Confirm" />
    </form>

    <footer>
      <p>&copy; 2026 Book Store. All rights reserved.</p>
    </footer>

    <script src="JavaScript/admin.js"></script>
  </body>
</html>
