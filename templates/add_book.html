{% load static %}
<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Add New Book - Book Store</title>
  <meta name="description" content="our book store" />
  <link rel="stylesheet" href="{% static 'CSS/main.css'%}" />
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="{% url 'admin_dashboard' %}">Dashboard</a></li>
        <li><a href="{% url 'borrowed_books' %}">Borrowed Books</a></li>
        <li><a href="{% url 'add-book' %}">Add New Book</a></li>
        <li><a href="{% url 'edit_book' %}">Edit/Delete Books</a></li>
        <li>
          <a>Welcome {{user.username}}</a>
        </li>
        <li>
          <a href="{% url 'Logout' %}" id="logout-link">Logout</a>
        </li>
      </ul>
    </nav>
  </header>

  <h1>Add a New Book</h1>

  <form action="{% url 'add-book' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="book_name">
      <input type="text" name="title" placeholder="Book Title" required />
    </div>
    <br />

    <div class="author">
      <input type="text" name="author" placeholder="Author Name" required />
    </div>
    <br />

    <div class="Category">
      <label for="Category">Category</label>
      <select name="category" id="Category">
        <option value="Horror">Horror</option>
        <option value="Romantic">Romantic</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Fiction">Fiction</option>
        <option value="Science">Science</option>
        <option value="History">History</option>
      </select>
    </div>
    <br />

    <div class="Price">
      <input type="number" step="0.01" name="price" placeholder="Price (e.g., 15.99)" required />
    </div>
    <br />
    <div class="image-upload">
      <label>Upload Book Cover:</label><br>
      <input type="file" name="cover_image" accept="image/*" />
    </div>
    <br>
    <div class="Description">
      <textarea placeholder="Description" rows="8" id="description" name="description"></textarea>
    </div>
    <br>

    <input type="submit" value="Confirm" class="btn" />
  </form>

  <footer>
    <p>&copy; 2026 Book Store. All rights reserved.</p>
  </footer>

  <script src="JavaScript/admin.js"></script>
</body>

</html>
